<div id="institu-modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
            <h3 id="modal-title" class="modal-title">Confirmação</h3>
            <button type="button" class="modal-close" aria-label="Fechar modal">&times;</button>
        </div>
        <div class="modal-body">
            <p id="modal-message">Tem a certeza que deseja realizar esta ação?</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-ghost modal-btn-cancel">Cancelar</button>
            <button type="button" class="btn btn-primary modal-btn-confirm">Confirmar</button>
        </div>
    </div>
</div>
