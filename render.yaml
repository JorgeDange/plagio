services:
  - type: web
    name: imetro-tfc
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: imetro-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: imetro-db
          property: host
      - key: PGUSER
        fromDatabase:
          name: imetro-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: imetro-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: imetro-db
          property: database
      - key: PGPORT
        fromDatabase:
          name: imetro-db
          property: port
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: LIMIAR_PLAGIO
        value: "0.85"
      - key: CHUNK_SIZE
        value: "200"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: "ollama"
      - key: LLM_MODEL
        value: "unimetro_analista"
      - key: LLM_API_KEY
        value: "c239a3d7dd"
      - key: OLLAMA_URL
        value: "https://ollama.com"

databases:
  - name: imetro-db
    plan: free
    databaseName: plagio
    ipAllowList: []
