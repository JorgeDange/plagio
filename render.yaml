services:
  - type: web
    name: imetro-tfc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: imetro-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: imetro-db
          property: host
      - key: PGUSER
        fromDatabase:
          name: imetro-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: imetro-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: imetro-db
          property: database
      - key: PGPORT
        fromDatabase:
          name: imetro-db
          property: port
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: LIMIAR_PLAGIO
        value: "0.85"
      - key: CHUNK_SIZE
        value: "200"
      - key: CHUNK_OVERLAP
        value: "50"

databases:
  - name: imetro-db
    plan: free
    databaseName: plagio
    ipAllowList: []
